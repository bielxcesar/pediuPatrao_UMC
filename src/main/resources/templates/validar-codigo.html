<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Validar Código - Pediu Patrão</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center min-vh-100">
<div class="container" style="max-width: 450px;">
    <div class="card shadow border-0">
        <div class="card-body p-4">
            <h3 class="fw-bold text-center mb-3">Digite o Código</h3>
            <p class="text-muted text-center small mb-4">
                Código gerado para: <strong th:text="${email}"></strong>
            </p>

            <div th:if="${sucesso}" class="alert alert-success py-2 small" th:text="${sucesso}"></div>
            <div th:if="${erro}" class="alert alert-danger py-2 small" th:text="${erro}"></div>

            <form th:action="@{/esqueci-senha/validar}" method="post">
                <input type="hidden" name="email" th:value="${email}"/>
                <div class="mb-3">
                    <label for="codigo" class="form-label">Código de Verificação (6 dígitos)</label>
                    <input type="text" id="codigo" name="codigo" class="form-control text-center fs-4" maxlength="6" required>
                </div>
                <button type="submit" class="btn btn-primary w-100 mb-2">Validar Código</button>
                <a href="/esqueci-senha" class="btn btn-outline-secondary w-100">Reenviar E-mail</a>
            </form>
        </div>
    </div>
</div>
</body>
</html>
