<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        #sidebar { display: flex; flex-direction: column; min-height: 100vh; }
        .submenu { padding-left: 1rem; }
    </style>
</head>
<body>
<div th:fragment="sidebar">
    <div id="sidebar">
        <h4 class="text-center py-3">Pediu Patrão</h4>

        <ul class="nav flex-column mb-auto">
            <li class="nav-item">
                <a class="nav-link" th:href="@{/}">
                    <i class="bi bi-house"></i> <span class="d-none d-md-inline">Home</span>
                </a>
            </li>

            <!-- Visível APENAS para ATENDENTE e GERENTE (Admin não vê) -->
            <li class="nav-item" sec:authorize="hasAnyAuthority('ATENDENTE', 'ROLE_ATENDENTE', 'GERENTE', 'ROLE_GERENTE')">
                <a class="nav-link" th:href="@{/clientes}">
                    <i class="bi bi-person-raised-hand"></i> <span class="d-none d-md-inline">Clientes</span>
                </a>
            </li>

            <!-- Visível para TODOS -->
            <li class="nav-item">
                <a class="nav-link" th:href="@{/pedidos}">
                    <i class="bi bi-bag"></i> <span class="d-none d-md-inline">Pedidos</span>
                </a>
            </li>

            <!-- Auditoria: Visível para ADMIN e GERENTE -->
            <li class="nav-item" sec:authorize="hasAnyAuthority('ADMIN', 'GERENTE')">
                <a class="nav-link" th:href="@{/auditoria}">
                    <i class="bi bi-clipboard-data"></i> <span class="d-none d-md-inline">Auditoria</span>
                </a>
            </li>

            <!-- Configurações (Usuários): Visível APENAS para ADMIN -->
            <li class="nav-item" sec:authorize="hasAuthority('ADMIN')">
                <a class="nav-link" th:href="@{/usuarios}">
                    <i class="bi bi-people-fill"></i> <span class="d-none d-md-inline">Gestão de Usuários</span>
                </a>
            </li>
        </ul>

        <div class="mt-auto p-3 w-100">
            <form th:action="@{/logout}" method="post" class="m-0">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                <button type="submit" class="btn btn-outline-danger w-100 fw-bold">
                    <i class="bi bi-box-arrow-right me-2"></i> Sair
                </button>
            </form>
        </div>
    </div>
</div>
</body>
</html>
