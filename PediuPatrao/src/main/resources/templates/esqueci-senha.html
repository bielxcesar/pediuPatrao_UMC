<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Recuperar Senha - Pediu Patrão</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center min-vh-100">
<div class="container" style="max-width: 450px;">
    <div class="card shadow border-0">
        <div class="card-body p-4">
            <h3 class="fw-bold text-center mb-3">Recuperar Senha</h3>
            <p class="text-muted text-center small mb-4">Informe o seu e-mail para receber o código temporário.</p>

            <div th:if="${erro}" class="alert alert-danger py-2 small" th:text="${erro}"></div>

            <form th:action="@{/esqueci-senha/solicitar}" method="post">
                <div class="mb-3">
                    <label for="email" class="form-label font-medium">E-mail cadastrado</label>
                    <input type="email" id="email" name="email" class="form-control" placeholder="exemplo@email.com" required>
                </div>
                <button type="submit" class="btn btn-primary w-100 mb-2">Enviar Código</button>
                <a href="/login" class="btn btn-outline-secondary w-100">Voltar ao Login</a>
            </form>
        </div>
    </div>
</div>
</body>
</html>
