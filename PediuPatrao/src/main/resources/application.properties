# Porta do servidor
server.port=${SERVER_PORT:8080}

# Conexão dinâmica com MongoDB (Usa .env ou fallback para banco local)
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/pizzaria_db}

# Configurações do Thymeleaf
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML
spring.thymeleaf.cache=false
spring.mvc.hiddenmethod.filter.enabled=true

# Logs do sistema
logging.level.com.umc.pediupatrao=DEBUG